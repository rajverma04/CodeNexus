name: Build and Publish Docker Images

# This section tells GitHub when to run this workflow.
# It will run every time you push code to the 'main' or 'master' branch.
on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
   
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get code from repository
      - name: Check out the repository
        uses: actions/checkout@v4

      # Step 2: Docker Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build the Frontend Docker image and push it to Docker Hub
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: rajverma4/codenexus-frontend:latest

      # Step 4: Build the Backend Docker image and push it to Docker Hub
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: rajverma4/codenexus-backend:latest
